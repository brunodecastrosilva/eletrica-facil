<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Elétrica Fácil</title>
<meta name="description" content="Orçamentos de elétrica sem calculadora">
<meta name="theme-color" content="#FAF6EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14120B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Elétrica Fácil">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: coluna única estilo app de bolso; amarelo de alta tensão + grafite, proposta em papel térmico */
:root{
  color-scheme:light;
  --bg:#FAF6EA; --surface:#FFFFFF; --surface-2:#FBF8EF; --line:#E7DEC4;
  --ink:#221D0E; --muted:#6C634B;
  --pri:#F5B800; --pri-ink:#1F1A06; --pri-soft:#FCEFC2; --pri-text:#865F00;
  --dark:#1F1B10; --dark-ink:#FFD23F;
  --ok:#1D7A46; --ok-soft:#DDF0E3; --info:#2F5D8A; --info-soft:#DFE9F3;
  --danger:#B0382A; --danger-soft:#F8E1DD;
  --paper:#FFFDF5; --paper-ink:#24221C;
  --shadow:0 1px 2px rgba(34,29,14,.06),0 6px 18px rgba(34,29,14,.07);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14120B; --surface:#1D1A10; --surface-2:#252113; --line:#3A3420;
  --ink:#F3ECD6; --muted:#ADA285;
  --pri:#FFC61A; --pri-ink:#1A1503; --pri-soft:#3A3010; --pri-text:#FFD24D;
  --dark:#0D0B06; --dark-ink:#FFD24D;
  --ok:#5BC488; --ok-soft:#173523; --info:#7FB0E0; --info-soft:#18283A;
  --danger:#E77B69; --danger-soft:#3D1E19;
  --paper:#ECE6D6; --paper-ink:#1E1C17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14120B; --surface:#1D1A10; --surface-2:#252113; --line:#3A3420;
  --ink:#F3ECD6; --muted:#ADA285;
  --pri:#FFC61A; --pri-ink:#1A1503; --pri-soft:#3A3010; --pri-text:#FFD24D;
  --dark:#0D0B06; --dark-ink:#FFD24D;
  --ok:#5BC488; --ok-soft:#173523; --info:#7FB0E0; --info-soft:#18283A;
  --danger:#E77B69; --danger-soft:#3D1E19;
  --paper:#ECE6D6; --paper-ink:#1E1C17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,label,input,select,textarea,[role=button]{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{overflow-x:clip;max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri-text);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
[hidden]{display:none!important}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 12px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--pri);display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;line-height:1;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--pri);display:inline-block}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:8px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
nav.tabs button{border:0;background:var(--surface);border-radius:10px;padding:7px 2px 6px;font-weight:600;font-size:11.5px;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;min-width:0}
nav.tabs button span.lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav.tabs button svg{width:19px;height:19px}
nav.tabs button[aria-selected="true"]{background:var(--pri);color:var(--pri-ink);box-shadow:none}
nav.tabs button.off{opacity:.38;background:transparent}
nav.tabs .badge{position:absolute;top:3px;right:4px;font-family:var(--f-mono);font-size:11px;background:var(--dark);color:var(--dark-ink);border-radius:99px;padding:0 6px;line-height:17px}

section.view{display:flex;flex-direction:column;gap:16px;padding-top:8px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px;margin:0}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.banner{background:var(--pri-soft);color:var(--pri-text);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.banner .grp{display:flex;gap:6px}

/* campos */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lab{font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],input:not([type]),select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px}
textarea{resize:vertical;min-height:76px;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--pri-text);outline:none;box-shadow:0 0 0 3px var(--pri-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row > .grow{flex:1 1 180px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.grid2.stack{grid-template-columns:1fr}}

.btn{border:0;border-radius:10px;padding:10px 16px;min-height:44px;font-weight:700;background:var(--pri);color:var(--pri-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.dark{background:var(--dark);color:var(--dark-ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger-text{color:var(--danger)}
.btn.small{min-height:34px;padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{flex:none}
.icon-btn{border:0;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none;padding:0}
.icon-btn:hover{color:var(--ink)}
.icon-btn.del:hover{color:var(--danger)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);min-height:44px}
.stepper button{border:0;background:none;width:38px;height:42px;font-size:18px;color:var(--muted);flex:none}
.stepper input{border:0!important;background:none!important;box-shadow:none!important;width:58px;text-align:center;padding:0;min-height:0}
.stepper.sm{min-height:36px}
.stepper.sm button{height:34px;width:36px}
.stepper.sm .num{min-width:40px;text-align:center;font-weight:600}
.stepper button:disabled{opacity:.3;cursor:not-allowed}

/* chips e segmentos */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:600;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);box-shadow:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);width:100%;background:var(--surface-2);border-radius:10px;padding:3px;box-shadow:inset 0 0 0 1px var(--line);gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 8px;font-weight:600;font-size:13.5px;color:var(--muted);min-height:36px;line-height:1.2;text-align:center;white-space:normal}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.pri button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);box-shadow:none}

.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14.5px;font-weight:600;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;flex:none}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked + .track{background:var(--pri)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:2px solid var(--pri-text);outline-offset:2px}
.adj-row{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px dashed var(--line)}
.adj-row:first-of-type{border-top:0;padding-top:0}
.adj-row .sub{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}

/* itens */
.items{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.item-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.item-name{font-weight:700;font-size:15.5px;min-width:0;overflow-wrap:anywhere}
.item-meta{color:var(--muted);font-size:13px}
.item-total{font-family:var(--f-mono);font-weight:600;font-size:15px;text-align:right;white-space:nowrap}
.item-actions{display:flex;gap:8px;align-items:center;justify-content:space-between}
.item-actions .grp{display:flex;gap:6px}
.item.cli .item-total{color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:14px}
.price-hint{margin:0;font-size:12.5px;color:var(--pri-text)}
.price-hint.other{background:var(--pri-soft);border-radius:8px;padding:6px 10px}

/* resumo */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
@media (max-width:560px){.sum-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.sum b{display:block;font-family:var(--f-mono);font-size:17px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum.muted b{color:var(--muted);text-decoration:line-through}
.sum.total{grid-column:1 / -1;display:flex;align-items:baseline;justify-content:space-between;gap:12px;background:var(--pri);color:var(--pri-ink)}
.sum.total .eyebrow{color:inherit;opacity:.8}
.sum.total b{font-size:20px}
.pay-lines{display:flex;flex-direction:column;gap:6px}
.pay-line{display:flex;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:14px}
.pay-line b{font-family:var(--f-mono);font-weight:600}

/* proposta em papel térmico */
.receipt-wrap{display:flex;flex-direction:column;gap:10px;min-width:0;max-width:380px;width:100%;margin-inline:auto}
.receipt{--zz:6px;background:var(--paper);color:var(--paper-ink);font-family:var(--f-mono);font-size:12.5px;line-height:19px;padding:16px 20px 20px;margin-block:var(--zz);position:relative;filter:drop-shadow(0 2px 5px rgba(0,0,0,.13))}
.receipt::before,.receipt::after{content:"";position:absolute;left:0;right:0;height:var(--zz);background-size:12px var(--zz);background-repeat:repeat-x}
.receipt::before{top:calc(-1 * var(--zz));background-image:conic-gradient(from 135deg at top,var(--paper) 90deg,#0000 0)}
.receipt::after{bottom:calc(-1 * var(--zz));background-image:conic-gradient(from -45deg at bottom,var(--paper) 90deg,#0000 0)}
.rc-brand{text-align:center;font-weight:600;font-size:14px;line-height:22px;letter-spacing:.02em}
.rc-center{text-align:center;line-height:18px}
.rc-small{font-size:11px!important;line-height:16px}
.receipt .rc-who{text-align:center;font-family:var(--f-display);font-weight:800;font-size:20px;line-height:30px;letter-spacing:-.01em;margin-top:-2px}
.receipt hr{border:0;border-top:1px dashed var(--paper-ink);margin:6px 0 8px}
.rc-line{display:flex;justify-content:space-between;gap:12px}
.rc-line span:first-child{min-width:0;overflow-wrap:anywhere}
.rc-line span:last-child{white-space:nowrap}
.rc-detail{font-size:11px;line-height:15px;padding-left:8px}
.rc-note{font-size:11.5px;line-height:17px}
.rc-total{font-weight:600;font-size:16px;line-height:26px;border-top:2px solid var(--paper-ink);padding-top:4px;margin-top:6px}
.rc-section{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-size:11px;line-height:12px;font-weight:600;letter-spacing:.16em}
.rc-section::before,.rc-section::after{content:"";flex:1;border-top:1px dashed var(--paper-ink)}
.rc-foot{text-align:center;font-size:11px;line-height:16px;margin-top:8px}
.rc-sign{margin-top:26px;border-top:1px solid var(--paper-ink);text-align:center;font-size:11px;line-height:16px;padding-top:4px}

.share-prev{display:flex;justify-content:center;background:var(--surface-2);border-radius:12px;padding:8px;min-height:120px;align-items:center}
.share-prev img{max-width:min(100%,360px);height:auto;border-radius:6px;-webkit-touch-callout:default}
.share-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:420px){.share-actions{grid-template-columns:repeat(2,minmax(0,1fr))}}
.share-btn{border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:600;font-size:13.5px;color:var(--ink);padding:8px 4px}
.share-btn svg{width:22px;height:22px;color:var(--pri-text)}
.share-btn:hover{box-shadow:inset 0 0 0 1.5px var(--pri-text)}
.share-btn:disabled{opacity:.5}
.share-btn.wa svg{color:#1FA855}

/* status */
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:1px 6px;white-space:nowrap}
.tag.rascunho{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.tag.enviado{background:var(--info-soft);color:var(--info)}
.tag.aprovado{background:var(--ok-soft);color:var(--ok)}
.tag.recusado{background:var(--danger-soft);color:var(--danger)}
.seg.status button[aria-pressed="true"][data-st="aprovado"]{background:var(--ok);color:#fff}
.seg.status button[aria-pressed="true"][data-st="recusado"]{background:var(--danger);color:#fff}
.seg.status button[aria-pressed="true"][data-st="enviado"]{background:var(--info);color:#fff}

/* histórico */
.hist{display:flex;flex-direction:column;gap:8px}
.hist-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);border:0;text-align:left;width:100%;color:var(--ink)}
.hist-row:hover{box-shadow:inset 0 0 0 1px var(--pri-text),var(--shadow)}
.hist-date{width:46px;text-align:center;background:var(--pri-soft);color:var(--pri-text);border-radius:10px;padding:6px 0;line-height:1.1}
.hist-date b{display:block;font-family:var(--f-display);font-size:19px;font-weight:800}
.hist-date small{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.hist-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.hist-sub{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.hist-total{font-family:var(--f-mono);font-weight:600;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.mini-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.mini-stats b{color:var(--ink)}

.stats-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.stats-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chart{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:170px;padding-top:22px;border-bottom:1px solid var(--line)}
.bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;outline:none}
.bar-stack{width:min(42px,70%);height:100%;display:flex;align-items:flex-end;position:relative}
.bar{position:absolute;left:0;right:0;bottom:0;border-radius:4px 4px 0 0;min-height:2px}
.bar.quoted{background:var(--pri-soft);box-shadow:inset 0 0 0 1px var(--line)}
.bar.won{background:var(--pri)}
.bar.zero{background:var(--line)}
.bar-val{position:absolute;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;transform:translateY(-4px)}
.bar-tip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:2;font-family:var(--f-mono)}
.bar-col:first-child .bar-tip,.bar-col:nth-child(2) .bar-tip{left:0;transform:none}
.bar-col:last-child .bar-tip,.bar-col:nth-last-child(2) .bar-tip{left:auto;right:0;transform:none}
.bar-col:hover .bar-tip,.bar-col:focus-visible .bar-tip{opacity:1}
.chart-x{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;font-size:12px;color:var(--muted);text-align:center;padding-top:6px;text-transform:capitalize}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rank{display:flex;flex-direction:column;gap:8px}
.rank-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:14px}
.rank-row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rank-row .vl{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right}
.rank-row .track2{grid-column:1 / -1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.rank-row .fill{height:100%;background:var(--pri);border-radius:99px}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}

/* cadastros */
.cat-list{display:flex;flex-direction:column}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.cat-row:first-child{border-top:0}
.cat-row .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}

    if (!items.length) return close();

/* ---------- Pix copia e cola (BR Code estático do Banco Central) ---------- */
const pixField = (id, v) => id + String(v.length).padStart(2, '0') + v;

  const dv = n => { let s = 0; for (let i = 0; i < n; i++) s += +d[i] * (n + 1 - i); const r = (s * 10) % 11; return r === 10 ? 0 : r; };

}

}

function receiptRows(d, c) {

  }

  if (!d.client.name) { toast('Informe o nome do cliente na aba Orçamento.'); return; }
  if (!d.items.length) { toast('Lance pelo menos um serviço antes de salvar.'); return; }
  const firstSave = !bills.some(b => b.id === d.id), now = Date.now();
  d.savedAt = now;
  const { isExample: _e, active: _a, ...rest } = d;
  const bill = clone({ ...rest, closedAt: firstSave ? now : (bills.find(b => b.id === d.id)?.closedAt || now), total: c.total });
  bills = [bill, ...bills.filter(b => b.id !== bill.id)].sort((a, b) => b.closedAt - a.closedAt);
  // cliente e preços ficam guardados para os próximos orçamentos
  const k = findClient(d.client.name);
  if (k) Object.assign(k, { last: now, phone: d.client.phone || k.phone, address: d.client.address || k.address });
  else catalog.clients.push({ name: d.client.name, phone: d.client.phone, address: d.client.address, last: now });
  d.items.forEach(it => { const p = findItem(it.name, it.kind); if (p) { p.lastPrice = it.price; p.last = now; } else catalog.items.push({ kind: it.kind, name: it.name, unit: it.unit, price: it.price, last: now }); });
  saveCatalog(); saveBills();
  draft = blankDraft(); saveDraft(); goTab('inicio');
  toast(firstSave ? 'Orçamento salvo no histórico.' : 'Orçamento atualizado no histórico.');
}

/* ---------- aba Histórico (com estatísticas) ---------- */
let histFilter = 'todos';
function statsHTML() {
  const total = sum(bills.map(b => b.total));
  const won = bills.filter(b => b.status === 'aprovado'), lost = bills.filter(b => b.status === 'recusado');
  const wonTotal = sum(won.map(b => b.total));
  const decided = won.length + lost.length;
  const rate = decided ? Math.round(won.length / decided * 100) : null;
  const now = new Date(), months = [];
  for (let k = 5; k >= 0; k--) { const dt = new Date(now.getFullYear(), now.getMonth() - k, 1); months.push({ y: dt.getFullYear(), m: dt.getMonth(), q: 0, w: 0, n: 0, label: dt.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '') }); }
  bills.forEach(b => { const dt = new Date(b.closedAt); const mo = months.find(x => x.y === dt.getFullYear() && x.m === dt.getMonth()); if (mo) { mo.q += b.total; mo.n++; if (b.status === 'aprovado') mo.w += b.total; } });
  const max = Math.max(...months.map(m => m.q), 1);
  const svc = {}, cli = {};
  bills.forEach(b => {
    b.items.filter(i => i.kind === 'svc').forEach(i => { const key = norm(i.name); svc[key] = svc[key] || { name: i.name, n: 0 }; svc[key].n++; });
    const key = norm(b.client.name); if (key) { cli[key] = cli[key] || { name: b.client.name, n: 0, v: 0 }; cli[key].n++; if (b.status === 'aprovado') cli[key].v += b.total; }
  });
  const topSvc = Object.values(svc).sort((a, b) => b.n - a.n).slice(0, 5);
  const topCli = Object.values(cli).sort((a, b) => b.v - a.v || b.n - a.n).slice(0, 5);
  const rank = (list, val, fmt) => { const mx = Math.max(...list.map(val), 1); return list.length ? `<div class="rank">${list.map(x => `<div class="rank-row"><span class="nm">${esc(x.name)}</span><span class="vl">${fmt(x)}</span><div class="track2"><div class="fill" style="width:${Math.round(val(x) / mx * 100)}%"></div></div></div>`).join('')}</div>` : '<p class="hint">Sem dados ainda.</p>'; };
  return `<div class="card">
    <div class="card-head"><h2>Resumo</h2></div>
    <div class="stats-tiles">
      <div class="sum"><span class="eyebrow">Orçamentos</span><b>${bills.length}</b></div>
      <div class="sum"><span class="eyebrow">Valor orçado</span><b>${BRL(total)}</b></div>
      <div class="sum"><span class="eyebrow">Aprovado</span><b>${BRL(wonTotal)}</b></div>
      <div class="sum"><span class="eyebrow">Aprovação</span><b>${rate === null ? '—' : rate + '%'}</b></div>
    </div>
    <div>
      <span class="eyebrow">Últimos 6 meses</span>
      <div class="chart" role="img" aria-label="Valor orçado e aprovado por mês">${months.map(m => `
        <div class="bar-col" tabindex="0">
          ${m.w > 0 ? `<span class="bar-val" style="bottom:${Math.max(2, m.w / max * 100)}%">${BRL(m.w).replace(/,\d\d$/, '')}</span>` : ''}
          <span class="bar-tip">${m.label}: ${BRL(m.w)} aprovado de ${BRL(m.q)} · ${plural(m.n, 'orçamento', 'orçamentos')}</span>
          <div class="bar-stack">
            <div class="bar ${m.q ? 'quoted' : 'zero'}" style="height:${m.q ? Math.max(2, m.q / max * 100) : 1}%"></div>
            ${m.w ? `<div class="bar won" style="height:${Math.max(2, m.w / max * 100)}%"></div>` : ''}
          </div>
        </div>`).join('')}</div>
      <div class="chart-x">${months.map(m => `<span>${m.label}</span>`).join('')}</div>
      <div class="legend" style="margin-top:8px"><span><i style="background:var(--pri)"></i>Aprovado</span><span><i style="background:var(--pri-soft);box-shadow:inset 0 0 0 1px var(--line)"></i>Orçado</span></div>
    </div>
  </div>
  <div class="two-col">
    <div class="card"><h2>Serviços mais orçados</h2>${rank(topSvc, x => x.n, x => plural(x.n, 'orçamento', 'orçamentos'))}</div>
    <div class="card"><h2>Melhores clientes</h2>${rank(topCli, x => x.v || x.n / 1000, x => `${plural(x.n, 'orçamento', 'orçamentos')} · ${BRL(x.v)}`)}</div>
  </div>`;
}
const viewHistorico = {
  html() {
    if (!bills.length) return `<div class="empty">Nenhum orçamento salvo ainda.<br>Monte um orçamento e toque em <b>Salvar no histórico</b>.</div>`;
    const list = histFilter === 'todos' ? bills : bills.filter(b => b.status === histFilter);

function openBill(id) {
  const b = bills.find(x => x.id === id); if (!b) return;
  const c = compute(b);
  openSheet(`<div class="card-head"><div><h3>${esc(b.client.name || 'Cliente sem nome')}</h3><span class="hint">${numStr(b.num)} · ${fmtDate(b.closedAt)} · ${BRL(c.total)}</span></div><button class="icon-btn close-x" id="sh-x" aria-label="Fechar">${I.x}</button></div>
    <div class="seg status" role="group" aria-label="Situação">${Object.entries(STATUS).map(([k, l]) => `<button type="button" data-st="${k}" aria-pressed="${b.status === k}">${l}</button>`).join('')}</div>
    <div class="receipt-wrap">${receiptHTML(b, c)}</div>
    ${shareButtonsHTML(b, c)}
    <div class="sheet-actions">
      <button class="btn ghost" id="sh-del" style="color:var(--danger)">${I.trash}Excluir</button>
      <button class="btn ghost" id="sh-edit">${I.edit}Abrir para editar</button>
      <button class="btn" id="sh-dup">${I.copy}Duplicar</button>
    </div>`, s => {
    $('#sh-x', s).onclick = closeSheet;
    $$('[data-st]', s).forEach(x => x.onclick = () => { b.status = x.dataset.st; b.statusAt = Date.now(); saveBills(); if (draft.id === b.id) { draft.status = b.status; saveDraft(); } openBill(id); render(); toast('Situação: ' + STATUS[b.status] + '.'); });
    bindShare(s, () => b, () => { if (b.status === 'rascunho') { b.status = 'enviado'; saveBills(); render(); } });
    $('#sh-del', s).onclick = () => confirmSheet('Excluir este orçamento?', 'Ele sai do histórico e das estatísticas. Clientes e preços cadastrados continuam, e dá para desfazer logo em seguida.', 'Excluir', () => {
      bills = bills.filter(x => x.id !== id); saveBills(); if (draft.id === id) { draft.savedAt = null; saveDraft(); } render();
      toast('Orçamento excluído.', { label: 'Desfazer', run: () => { bills = [b, ...bills].sort((x, y) => y.closedAt - x.closedAt); saveBills(); render(); } });
    }, true);
    const replace = fn => confirmReplace(() => { draft = fn(); draft.active = true; closeSheet(); tab = 'orcamento'; commit(); window.scrollTo({ top: 0 }); });
    $('#sh-edit', s).onclick = () => replace(() => migrate({ ...clone(b), isExample: false }));
    $('#sh-dup', s).onclick = () => replace(() => {
      const d = migrate({ ...clone(b), id: newId(), createdAt: Date.now(), savedAt: null, status: 'rascunho', isExample: false });
      d.items = d.items.map(i => ({ ...i, id: newId() }));
      catalog.seq = (catalog.seq || 0) + 1; d.num = catalog.seq; saveCatalog();
      return d;
    });
  });
}

const tour = {
  i: -1, el: null, bound: false, raf: 0, watchId: 0, lastKey: '',
  active() { return this.i >= 0 && !!this.el; },
  start(at = 0) { if (!draft.isExample) return; this.mount(); this.show(at, 1); this.watch(); },
  stop() { this.i = -1; cancelAnimationFrame(this.watchId); this.watchId = 0; if (this.el) { this.el.remove(); this.el = null; } },
  watch() {
    cancelAnimationFrame(this.watchId); this.lastKey = '';
    const tick = () => {
      if (!this.active()) return;
      const st = TOUR[this.i], t = st && tab === st.tab ? this.target(st) : null, r = t && t.getBoundingClientRect();
      const key = (r ? [r.left, r.top, r.width, r.height].map(Math.round).join() : '-') + '|' + window.innerHeight + '|' + ($('.tour-card', this.el)?.offsetHeight || 0);
      if (key !== this.lastKey) { this.lastKey = key; this.place(); }
      this.watchId = requestAnimationFrame(tick);
    };
    this.watchId = requestAnimationFrame(tick);
  },
  mount() {
    if (this.el) return;
    const el = document.createElement('div'); el.className = 'tour';
    el.innerHTML = '<div class="tour-hole" hidden></div><div class="tour-card" role="dialog" aria-modal="false" aria-label="Guia"></div>';
    document.body.appendChild(el); this.el = el;
    if (!this.bound) {
      this.bound = true;
      const again = () => { if (this.active()) { cancelAnimationFrame(this.raf); this.raf = requestAnimationFrame(() => this.place()); } };
      window.addEventListener('scroll', again, { passive: true });
      window.addEventListener('resize', again);
    }
  },
  target(st) { return (st && $(st.sel)) || null; },
  show(n, dir) {
    if (!draft.isExample) return this.stop();
    if (n < 0) n = 0;
    if (n >= TOUR.length) return this.stop();
    const st = TOUR[n];
    if (st.tab && tab !== st.tab) { tab = st.tab; closeSheet(); render(); }
    this.i = n;
    const last = n === TOUR.length - 1;
    $('.tour-card', this.el).innerHTML = `<div class="tour-top"><span class="eyebrow">Guia · ${n + 1} de ${TOUR.length}</span><button class="tour-x" aria-label="Fechar guia">${I.x}</button></div>
      <div class="tour-bar"><i style="width:${Math.round((n + 1) / TOUR.length * 100)}%"></i></div>
      <h3>${esc(st.t)}</h3><p>${esc(st.d)}</p>
      <div class="tour-act">${n ? '<button class="btn small ghost" data-tour="-1">Voltar</button>' : '<span></span>'}<button class="btn small" data-tour="1">${last ? 'Concluir' : 'Próximo'}</button></div>`;
    $('.tour-x', this.el).onclick = () => this.stop();
    $$('[data-tour]', this.el).forEach(b => b.onclick = () => { const d = +b.dataset.tour; if (d > 0 && last) return this.stop(); this.show(this.i + d, d); });
    const t = this.target(st);
    if (t) {
      const r = t.getBoundingClientRect(), vh = window.innerHeight;
      const want = Math.max(80, Math.min(vh * .18, vh - r.height - 230));
      window.scrollTo({ top: Math.max(0, window.scrollY + r.top - want) });
    }
    this.place(); setTimeout(() => this.place(), 400);
  },
  place() {
    if (!this.active()) return;
    const st = TOUR[this.i], hole = $('.tour-hole', this.el), card = $('.tour-card', this.el);
    const t = st && tab === st.tab ? this.target(st) : null;
    const vh = window.innerHeight, ch = card.offsetHeight, gap = 12, pad = 6;
    let top;
    if (t) {
      const r = t.getBoundingClientRect();
      const nav = $('#tabs'), navB = nav && !nav.contains(t) ? nav.getBoundingClientRect().bottom + 2 : 4;
      const y1 = Math.max(r.top - pad, navB), y2 = Math.min(r.bottom + pad, vh - 4);
      hole.hidden = y2 - y1 < 8;
      Object.assign(hole.style, { left: (r.left - pad) + 'px', top: y1 + 'px', width: (r.width + pad * 2) + 'px', height: Math.max(0, y2 - y1) + 'px' });
      if (!hole.hidden && y2 + gap + ch <= vh - gap) top = y2 + gap;
      else if (!hole.hidden && y1 - gap - ch >= navB) top = y1 - gap - ch;
    } else hole.hidden = true;
    if (top === undefined) { card.style.top = ''; card.classList.add('dock'); }
    else { card.classList.remove('dock'); card.style.top = top + 'px'; }
    this.el.classList.toggle('dim', !t || hole.hidden);
  },
};

/* ---------- início ---------- */
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw', e));
</script>
